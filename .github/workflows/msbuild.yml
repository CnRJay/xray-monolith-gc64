name: Build DX11

run-name: >-
  ${{ github.event_name == 'pull_request' && format('Build DX11 PR #{0} ({1})', github.event.pull_request.number, github.head_ref) || format('Build DX11 ({0})', github.ref_name) }}

on:
  push:
    branches:
      - "all-in-one-vs2022-wpo"
      - "feat/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "all-in-one-vs2022-wpo"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional version tag to publish as a GitHub Release (e.g. v0.3.0). Leave empty for a CI build only."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: msbuild-dx11-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION_FILE_PATH: src/engine-vs2026.sln

jobs:
  build_dx11:
    name: Build DX11 (x64)
    runs-on: windows-2025-vs2026

    steps:
      - name: Configure Pagefile
        uses: al-cheb/configure-pagefile-action@v1.3
        with:
          minimum-size: 8GB
          maximum-size: 8GB
          disk-root: "C:"

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Init submodules
        uses: snickerbockers/submodules-init@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: "[18.0, 19.0)"
          msbuild-architecture: "x64"

      - name: Build DX11
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: msbuild ${{ env.SOLUTION_FILE_PATH }} /p:Configuration=DX11 /p:Platform=x64 /m /nologo /v:minimal

      - name: Upload DX11 Executable
        uses: actions/upload-artifact@v4.6.0
        with:
          name: DX11_exe
          path: ./_build/_game/bin_dbg/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Zip DX11 PDB
        run: |
          Push-Location "./_build/_game/bin_dbg"
          Compress-Archive -DestinationPath "STALKER-Anomaly-DX11_pdb.zip" -Path "./*.pdb"
          Pop-Location

      - name: Upload DX11 PDB
        uses: actions/upload-artifact@v4.6.0
        with:
          name: DX11_pdb
          path: ./_build/_game/bin_dbg/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [build_dx11]
    name: Publish DX11 Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Resolve Release Tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Extract Changelog Notes
        shell: python
        env:
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          from pathlib import Path
          changelog = Path("CHANGELOG.md")
          notes = ""
          if changelog.exists():
              lines = changelog.read_text(encoding="utf-8").splitlines()
              tag = __import__("os").environ["RELEASE_TAG"].lstrip("v")
              # Prefer matching version header (e.g. ## [0.3.0]), fall back to first ## section
              def extract(target_prefix=None):
                  capture = False
                  out = []
                  for line in lines:
                      if line.startswith("## "):
                          if capture:
                              break
                          if target_prefix is None or target_prefix in line:
                              capture = True
                              continue
                      elif capture:
                          out.append(line)
                  return "\n".join(out).strip()
              notes = extract(f"[{tag}]") or extract()
          Path("release_notes.md").write_text(notes + "\n" if notes else "", encoding="utf-8")

      - name: Download artifacts
        uses: actions/download-artifact@v4.1.8

      - name: Package Drag-and-Drop Anomaly Release
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          mkdir -p release/bin release/gamedata pdb
          cp -r gamedata/. release/gamedata/
          mv DX11_exe/*.exe release/bin/
          mv DX11_pdb/*.zip "pdb/STALKER-Anomaly-DX11_${TAG}_pdb.zip"

          cd release
          zip -r "../STALKER-Anomaly-DX11_${TAG}.zip" bin gamedata
          cd ..

      - name: Publish Release
        uses: softprops/action-gh-release@v2.3.2
        with:
          files: |
            STALKER-Anomaly-DX11_*.zip
            pdb/*.zip
          tag_name: "${{ steps.ver.outputs.tag }}"
          name: "X-Ray Monolith DX11 ${{ steps.ver.outputs.tag }}"
          body_path: release_notes.md
          generate_release_notes: true
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Remove build artifacts
        uses: c-hive/gha-remove-artifacts@v1.2.0
        with:
          age: "1 second"
