name: Build DX11

run-name: >-
  ${{ github.event_name == 'pull_request' && format('Build DX11 PR #{0} ({1})', github.event.pull_request.number, github.head_ref) || format('Build DX11 ({0})', github.ref_name) }}

on:
  push:
    branches:
      - "all-in-one-vs2022-wpo"
      - "feat/**"
  pull_request:
    branches:
      - "all-in-one-vs2022-wpo"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msbuild-dx11-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION_FILE_PATH: src/engine-vs2026.sln
  PACK_GAMEDATA_NAME: 00_modded_exes_gamedata.db0

jobs:
  pack_gamedata:
    if: github.event_name == 'push' && github.ref == 'refs/heads/all-in-one-vs2022-wpo'
    name: Pack gamedata
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Pack gamedata
        run: |
          New-Item -Path "./compressor/gamedata" -ItemType Directory -Force | Out-Null
          Copy-Item -Path "./gamedata/*" -Destination "./compressor/gamedata" -Recurse -Force
          Push-Location "./compressor"
          Start-Process -FilePath "./! compress_gamedata.cmd" -Wait
          Rename-Item -Path "gamedata.db0" -NewName "${{ env.PACK_GAMEDATA_NAME }}"
          Pop-Location

      - name: Upload gamedata
        uses: actions/upload-artifact@v4.6.0
        with:
          name: ${{ env.PACK_GAMEDATA_NAME }}
          path: ./compressor/${{ env.PACK_GAMEDATA_NAME }}
          if-no-files-found: error
          retention-days: 1

  build_dx11:
    name: Build DX11 (x64)
    runs-on: windows-2025-vs2026

    steps:
      - name: Configure Pagefile
        uses: al-cheb/configure-pagefile-action@v1.3
        with:
          minimum-size: 8GB
          maximum-size: 8GB
          disk-root: "C:"

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Init submodules
        uses: snickerbockers/submodules-init@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: "[18.0, 19.0)"
          msbuild-architecture: "x64"

      - name: Build DX11
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: msbuild ${{ env.SOLUTION_FILE_PATH }} /p:Configuration=DX11 /p:Platform=x64 /m /nologo /v:minimal

      - name: Upload DX11 Executable
        uses: actions/upload-artifact@v4.6.0
        with:
          name: DX11_exe
          path: ./_build/_game/bin_dbg/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Zip DX11 PDB
        run: |
          Push-Location "./_build/_game/bin_dbg"
          Compress-Archive -DestinationPath "STALKER-Anomaly-modded-exes_DX11_pdb.zip" -Path "./*.pdb"
          Pop-Location

      - name: Upload DX11 PDB
        uses: actions/upload-artifact@v4.6.0
        with:
          name: DX11_pdb
          path: ./_build/_game/bin_dbg/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/all-in-one-vs2022-wpo'
    needs: [pack_gamedata, build_dx11]
    name: Publish DX11 Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get Datetime
        id: datetime
        run: echo "today=$(date +'%-Y.%-m.%-d')" >> "$GITHUB_OUTPUT"

      - name: Extract Changelog Notes
        shell: python
        run: |
          from pathlib import Path
          changelog = Path("CHANGELOG.md")
          notes = ""
          if changelog.exists():
              lines = changelog.read_text(encoding="utf-8").splitlines()
              capture = False
              out = []
              for line in lines:
                  if line.startswith("## "):
                      if capture:
                          break
                      capture = True
                      continue
                  if capture:
                      out.append(line)
              notes = "\n".join(out).strip()
          Path("release_notes.md").write_text(notes + "\n" if notes else "", encoding="utf-8")

      - name: Download artifacts
        uses: actions/download-artifact@v4.1.8

      - name: Package DX11 Release
        run: |
          mkdir -p release/bin release/db/mods pdb
          mv "${{ env.PACK_GAMEDATA_NAME }}"/*.db0 release/db/mods/
          mv DX11_exe/*.exe release/bin/
          mv DX11_pdb/*.zip pdb/

          cd release
          zip -r "../STALKER-Anomaly-modded-exes-DX11_${{ steps.datetime.outputs.today }}.zip" ./*
          cd ..

      - name: Publish Release
        uses: softprops/action-gh-release@v2.3.2
        with:
          files: |
            *.zip
            pdb/*.zip
          tag_name: "${{ steps.datetime.outputs.today }}"
          body_path: release_notes.md
          generate_release_notes: true
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Remove build artifacts
        uses: c-hive/gha-remove-artifacts@v1.2.0
        with:
          age: "1 second"
